<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;padding:0;background:transparent;font-family:Manrope,sans-serif;}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  svg{width:100%;height:100%;}
  .city-label{font-size:13px;font-weight:700;fill:#2D2F84;}
  .city-label-idf{font-size:14px;font-weight:800;fill:#2D2F84;}
  .badge-text{font-size:10.5px;font-weight:800;fill:#fff;}
</style>
</head>
<body>
<div id="wrap"><svg id="map" viewBox="0 0 900 920"></svg></div>
<script>
const CITIES = [
  { name:"Île-de-France", lon:2.3522, lat:48.8566, antennes:4, idf:true },
  { name:"Lille", lon:3.0573, lat:50.6292 },
  { name:"Tours", lon:0.6848, lat:47.3941 },
  { name:"Orléans", lon:1.9093, lat:47.9029 },
  { name:"Angers", lon:-0.5632, lat:47.4784 },
  { name:"Nantes", lon:-1.5534, lat:47.2184 },
  { name:"Bordeaux", lon:-0.5792, lat:44.8378 },
  { name:"Toulouse", lon:1.4442, lat:43.6047 },
  { name:"Montpellier", lon:3.8767, lat:43.6108 },
  { name:"Marseille", lon:5.3698, lat:43.2965 },
];

const W = 900, H = 920;
const svg = d3.select("#map");

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topology => {
  const countries = topojson.feature(topology, topology.objects.countries);
  const franceRaw = countries.features.find(f => f.id === "250");

  // Keep only mainland France + Corsica polygons (drop overseas territories)
  // by discarding any polygon ring whose points fall outside a European bbox.
  const inEurope = ([lon, lat]) => lon > -6 && lon < 10 && lat > 41 && lat < 52;
  const polygons = franceRaw.geometry.type === "MultiPolygon"
    ? franceRaw.geometry.coordinates
    : [franceRaw.geometry.coordinates];
  const kept = polygons.filter(poly => poly[0].every(inEurope));
  const france = { type: "Feature", geometry: { type: "MultiPolygon", coordinates: kept } };

  const projection = d3.geoConicConformal()
    .parallels([44, 49])
    .rotate([-3, 0])
    .fitSize([W - 260, H - 260], france);
  const path = d3.geoPath(projection);

  const g = svg.append("g").attr("transform", "translate(130,130)");

  g.append("path")
    .datum(france)
    .attr("d", path)
    .attr("fill", "#EDEDF6")
    .attr("stroke", "#2D2F84")
    .attr("stroke-width", 1.5)
    .attr("stroke-opacity", 0.35);

  CITIES.forEach(c => {
    const [x, y] = projection([c.lon, c.lat]);
    const r = c.idf ? 11 : 7;
    const fill = c.idf ? "#C8A951" : "#00A09A";

    g.append("circle")
      .attr("cx", x).attr("cy", y).attr("r", r + 6)
      .attr("fill", fill).attr("fill-opacity", 0.16);
    g.append("circle")
      .attr("cx", x).attr("cy", y).attr("r", r)
      .attr("fill", fill)
      .attr("stroke", "#FBFAF8").attr("stroke-width", 2.5);

    if (c.idf) {
      g.append("text")
        .attr("x", x).attr("y", y + 4)
        .attr("text-anchor", "middle")
        .attr("class", "badge-text")
        .text(c.antennes);
    }

    const labelAnchor = x > W - 160 ? "end" : "start";
    const dx = labelAnchor === "end" ? -(r + 10) : (r + 10);
    g.append("text")
      .attr("x", x + dx).attr("y", y + 4)
      .attr("text-anchor", labelAnchor)
      .attr("class", c.idf ? "city-label-idf" : "city-label")
      .text(c.name);
  });
}).catch(err => {
  svg.append("text").attr("x", 20).attr("y", 40).text("Carte indisponible").attr("fill", "#9A9AA6");
  console.error(err);
});
</script>
</body>
</html>
